modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Combate hack and slash: combos, golpes animados no Blockbench, parry, postura, Issen, rajada, rolamento e números de dano.
Hack and slash combat: combos, Blockbench-animated moves, parry, posture, Issen, flurry, dodge roll and damage numbers.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Bino's Vanilla+ Movement (motor de animacao e camera): obrigatorio
[[dependencies.${mod_id}]]
    modId="binosmovement"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"
