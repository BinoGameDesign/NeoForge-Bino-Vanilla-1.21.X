// Bino's Vanilla+ Combat: o hack and slash (combos, golpes do Blockbench, parry, postura, Issen, rajada, rolamento,
// numeros de dano, mira nova). Precisa do Bino's Vanilla+ Movement (motor de animacao e camera).
//   Gerar o .jar: tarefa Gradle  combat > build > build   ->  combat/build/libs/binoscombat-<versao>.jar
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

// o Movement precisa estar configurado antes (o Combat usa as classes dele)
evaluationDependsOn(':movement')

def modId = project.combat_mod_id

version = project.combat_mod_version
group = 'com.bino.binoscombat'

base {
    archivesName = modId
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            def mcUser = project.findProperty('mc_user')
            if (mcUser) programArguments.addAll '--username', mcUser.toString()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', modId, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
        "binosmovement" {
            sourceSet(project(':movement').sourceSets.main)
        }
    }
}

dependencies {
    // motor de animacao e camera (Bino's Vanilla+ Movement): obrigatorio
    implementation project(':movement')
    // so para testar no runClient (nao vira dependencia do mod)
    runtimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    runtimeOnly "maven.modrinth:iris:1.8.12+1.21.1-neoforge"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            loader_version_range   : project.loader_version_range,
            mod_id                 : modId,
            mod_name               : project.combat_mod_name,
            mod_license            : project.combat_mod_license,
            mod_version            : project.combat_mod_version,
            mod_authors            : project.combat_mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
