modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Animações novas do jogador feitas no Blockbench, câmera em primeira pessoa que acompanha o corpo (e o próprio corpo visível), câmera no ombro e movimentos do dia a dia.
New player animations made in Blockbench, a first-person camera that follows the body (with your own body visible), an over-the-shoulder camera and everyday movement.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
