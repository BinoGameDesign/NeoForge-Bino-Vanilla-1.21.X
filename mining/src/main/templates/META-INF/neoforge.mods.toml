modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Rubi, safira e jade; ferramentas e armaduras de gema; pedras de forja e a Pedra Filosofal; a Mesa de Lapidação e as cenas da bancada e da bigorna.
Ruby, sapphire and jade; gem tools and armor; forge stones and the Philosopher's Stone; the Lapidary Table and cinematic crafting scenes.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
